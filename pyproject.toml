[project]
name = "modern-joint-bert"
version = "0.1.0"
description = "JointBERT intent classification and slot filling on SNIPS with modern embedding models."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "git-python>=1.1.1",
  "lightning>=2.6.6",
  "pre-commit>=4.6.2",
  "pydantic>=2.13.5",
  "pydocstyle>=6.3.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.8",
  "torch>=2.14.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.16.0",
  "torchvision>=0.29.0",
  "ty>=0.0.83",
  "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["modern_joint_bert"]

[tool.uv.sources]
git-python = { git = "https://github.com/pynickle/git-python.git" }

[tool.ruff.lint.isort]
known-first-party = ["modern_joint_bert"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
train = "modern_joint_bert.scripts.train:main"
